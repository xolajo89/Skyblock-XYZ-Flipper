<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XYZ FLIPPER Login</title><link rel="stylesheet" href="login.css"></head><body><video autoplay muted loop playsinline><source src="background.mp4" type="video/mp4"></video><main><form id="login"><div class="logo">XYZ</div><p>XYZ FLIPPER</p><h1>Web Dashboard</h1><label>Username<input id="username" autocomplete="username" required autofocus></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><div id="error"></div><button>Sign in</button></form></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.href='/';else error.textContent='Invalid username or password.'}</script></body></html>
